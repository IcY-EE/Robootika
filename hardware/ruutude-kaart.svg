<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 686" role="img" aria-label="Ruutude numeratsioon"><style>
:root{--bg:#f6f5f1;--card:#fff;--text:#2c2c2a;--muted:#6b6a65;--line:#e3e1d9;--ink:#2c2c2a;--box:#f1efe8;--dk:#c9a27e;--lt:#f4ecdb;--sqt:#3d2a1a}


*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
main{max-width:1080px;margin:0 auto;padding:16px}h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:28px 0 8px}p{margin:6px 0}.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto}

.t{font-size:14px;fill:var(--text)}.ts{font-size:12px;fill:var(--muted)}.tsg{font-size:12px;fill:#1D9E75}.tl{font-size:13px;font-weight:600}.th{font-size:15px;font-weight:600;fill:var(--text)}
.bx{fill:var(--box);stroke:var(--muted);stroke-width:1}.ard{stroke:#378ADD}.mcp{stroke:#185FA5}.reed{stroke:#1D9E75}.lcd{stroke:#3B6D11}.led{stroke:#7F77DD}
.dk{fill:var(--dk)}.lt{fill:var(--lt)}.sqn{font-size:15px;font-weight:700;fill:var(--sqt)}.sqs{font-size:11px;fill:var(--sqt)}.sql{font-size:11px;font-weight:700;fill:#534AB7}
.arrow{stroke:#7F77DD;stroke-width:2.5}.jump{stroke:#7F77DD;stroke-width:2;stroke-dasharray:6 4}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
.tw{max-height:420px;overflow:auto}
